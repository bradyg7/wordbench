<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bible Workbench</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/desk.css">
  <link rel="stylesheet" href="./src/rail.css">
  <link rel="stylesheet" href="./src/menu.css">
</head>
<body>
  <header id="bar" class="bar">
    <div class="bar-row">
      <button class="icon" id="prev" aria-label="Previous chapter">‹</button>
      <button id="place" class="place" aria-label="Book and chapter"></button>
      <button class="icon" id="next" aria-label="Next chapter">›</button>
      <div id="cmdbox" class="cmdbox">
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Search, go to a place, or type a command" aria-label="Command field">
        <span class="cmd-tools" aria-label="The reader's tools"></span>
        <kbd class="cmd-key" title="Backtick opens the field">`</kbd>
      </div>
      <button class="icon" id="more" aria-label="More">⋯</button>
    </div>
    <nav id="trailline" class="trail-line" aria-label="Trail"></nav>
    <div id="planstrip" class="plan-strip" aria-label="Today’s reading" hidden></div>
  </header>
  <div id="findbar" class="findbar" hidden></div>
  <main id="scroller">
    <article id="reader" class="reader" aria-live="polite"></article>
  </main>
  <div id="dock"></div>
  <button id="pen" class="fab" aria-label="Write">✎</button>
  <nav id="tabs" class="tabs">
    <button class="on" id="tab-read">Read</button><button id="tab-notebook">Notebook</button><button id="tab-study">Study</button><button id="tab-more">More</button>
  </nav>
  <div id="overlay"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
