[workspace]
resolver = "2"
members = ["crates/wb-core", "crates/wb-cli", "app/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.dependencies]
wb-core = { path = "crates/wb-core" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
