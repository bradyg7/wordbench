[workspace]
resolver = "2"
members = ["crates/wb-core", "crates/wb-cli", "app/src-tauri", "spikes/sync", "spikes/pdf"]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.dependencies]
wb-core = { path = "crates/wb-core" }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
fancy-regex = "0.20"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
