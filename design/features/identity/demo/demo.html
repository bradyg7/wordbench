<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* design/features/identity, the working demo (round 2). Scripture and lexicon come from data.json (wb chapter, wb strong);
   the page texts are the demo's own invented study words. Nothing here is the app; it is for feeling the design. */
:root { --paper:#F4F6F1; --panel:#EAEEE6; --ink:#20261F; --muted:#6A7368; --line:#DDE3D8; --accent:#5E7D63; --accent-soft:#E0E9DF;
  --glass: rgba(248,250,246,.9); --glass-edge: rgba(255,255,255,.85); --shadow: 0 12px 36px rgba(30,40,30,.14), 0 2px 6px rgba(30,40,30,.06);
  --ui: Inter, system-ui, sans-serif; --serif: 'Source Serif 4', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--ui); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
#stage { position: fixed; inset: 0; }
.bg { position: absolute; inset: 0; background:
  radial-gradient(600px 400px at 15% 20%, #dfe9dc 0, transparent 70%), radial-gradient(700px 500px at 85% 75%, #e8eadf 0, transparent 70%),
  radial-gradient(500px 360px at 70% 10%, #e3ece6 0, transparent 70%), var(--paper); }
/* the top line: desks and the options */
#top { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; z-index: 5000; }
.desk { white-space: nowrap; flex: none; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.5); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.desk.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.desk.drop { outline: 2px dashed var(--accent); }
#opts-btn { margin-left: auto; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.6); font-size: 13px; }
#opts { position: absolute; top: 44px; right: 12px; width: 330px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--glass-edge); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; z-index: 6000; display: none; }
#opts.open { display: block; }
#opts h4 { margin: 10px 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; } .seg button { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.6); font-size: 12.5px; }
.seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
#opts p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
/* the desk area */
#desk { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
svg#threads { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
svg#threads path { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .55; }
/* a bubble: liquid glass */
.win { position: absolute; display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border-radius: 18px; box-shadow: var(--shadow), inset 0 1px 0 var(--glass-edge); border: 1px solid rgba(255,255,255,.6);
  transition: left .28s cubic-bezier(.2,.9,.3,1.15), top .28s cubic-bezier(.2,.9,.3,1.15), width .28s cubic-bezier(.2,.9,.3,1.15), height .28s cubic-bezier(.2,.9,.3,1.15), transform .25s, opacity .2s; overflow: hidden; }
.win.dragging { transition: none; box-shadow: 0 24px 60px rgba(30,40,30,.24); transform: scale(1.015); }
.win.front { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.win.t-bible { --tint: #5E7D63; } .win.t-word { --tint: #6A5AA3; } .win.t-page { --tint: #B5562F; } .win.t-folder { --tint: #2A7D99; }
.win::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tint); opacity: .7; }
.wt { height: 38px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; cursor: grab; user-select: none; }
.wt .ttl { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.wt .app { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.wt button { width: 24px; height: 24px; border-radius: 6px; color: var(--muted); } .wt button:hover { background: rgba(0,0,0,.05); color: var(--ink); }
.wt button:disabled { opacity: .3; cursor: default; }
.wb { flex: 1; overflow: auto; padding: 4px 18px 16px; }
.cols { display: flex; gap: 14px; height: 100%; } .cols > .col { flex: 1; min-width: 0; overflow: auto; border-right: 1px solid var(--line); padding-right: 12px; } .cols > .col:last-child { border: 0; }
.col h5 { margin: 6px 0; font-size: 12px; color: var(--muted); display: flex; gap: 6px; } .col h5 button { color: var(--accent); font-size: 11px; }
.scr { font-family: var(--serif); font-size: 16.5px; line-height: 1.65; }
.scr .vn { font: 600 10px var(--ui); color: var(--muted); vertical-align: super; margin: 0 3px 0 2px; }
.scr .w[data-s] { cursor: pointer; border-radius: 3px; } .scr .w[data-s]:hover { background: var(--accent-soft); color: var(--accent); }
.scr .lit { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 3px; }
.lex .lem { font: 600 28px var(--serif); } .lex .tr { color: var(--muted); } .lex p { margin: 8px 0; }
.lex .use { display: block; padding: 5px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-family: var(--serif); } .lex .use:hover { color: var(--accent); }
.pg h2 { margin: 6px 0 8px; font-size: 22px; } .pg [contenteditable] { outline: 0; min-height: 60px; }
.pg .ref { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
.fl .it { display: flex; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer; } .fl .it:hover { color: var(--accent); }
/* stacks: fanned cards */
.win.behind { cursor: pointer; } .win.behind .wb { opacity: .25; }
.stackbadge { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 7px; }
/* snap zones and magnet guides */
#zones { position: absolute; top: 52px; left: 50%; transform: translateX(-50%) translateY(-20px); opacity: 0; pointer-events: none; display: flex; gap: 10px; padding: 10px;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; box-shadow: var(--shadow); z-index: 4500; transition: .2s; }
#zones.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.zone { width: 104px; height: 64px; display: grid; gap: 3px; padding: 3px; border-radius: 9px; background: rgba(255,255,255,.7); }
.zone i { display: block; background: var(--accent-soft); border-radius: 5px; } .zone i.hot { background: var(--accent); }
#ghost { position: absolute; border-radius: 18px; border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; z-index: 4400; display: none; transition: all .12s; }
/* the dock */
#dockzone { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; z-index: 5500; }
#dock { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 110px); display: flex; gap: 6px; padding: 8px 10px; border-radius: 22px; z-index: 5600;
  background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-edge); transition: transform .25s cubic-bezier(.2,.9,.3,1.1); align-items: flex-end; }
#dock.up { transform: translate(-50%, 0); }
#dock .ai { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); position: relative; transition: width .15s, height .15s; }
#dock .ai:hover { width: 60px; height: 60px; }
#dock .ai .nm { position: absolute; top: -30px; background: var(--ink); color: var(--paper); font-size: 11.5px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; display: none; }
#dock .ai:hover .nm { display: block; }
#dock .ai .run { position: absolute; bottom: -6px; width: 4px; height: 4px; border-radius: 2px; background: var(--muted); }
#dock .sep { width: 1px; background: var(--line); margin: 4px 3px; align-self: stretch; }
/* history */
#hist { position: absolute; left: 16px; right: 16px; bottom: 76px; z-index: 5200; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 18px;
  box-shadow: var(--shadow); padding: 12px 16px; display: none; } #hist.open { display: block; }
#hist .hrow { display: flex; align-items: center; gap: 10px; }
#hist input[type=range] { flex: 1; accent-color: var(--accent); }
#hist .lbl { font-size: 12.5px; color: var(--muted); min-width: 260px; }
#hist svg { width: 100%; height: 150px; } #hist svg circle { cursor: pointer; } #hist svg text { font: 10.5px var(--ui); fill: var(--muted); }
.hbtn { position: absolute; right: 16px; bottom: 16px; z-index: 5300; padding: 8px 14px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); font-size: 13px; }
.past #desk { filter: sepia(.12); }
/* ask popover, home */
.pop { position: absolute; z-index: 7000; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; min-width: 180px; }
.pop button { text-align: left; padding: 6px 10px; border-radius: 6px; } .pop button:hover { background: var(--accent-soft); }
#home { position: absolute; inset: 44px 0 0 0; z-index: 4000; display: none; padding: 40px 10%; overflow: auto; }
#home.open { display: block; } #home .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; }
.tile { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 20px; }
.tile h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.tile button.go { margin-top: 10px; background: var(--accent); color: #fff; border-radius: 10px; padding: 7px 14px; }
/* phone */
body.phone { background: #cfd5cb; }
body.phone #stage { inset: auto; width: 390px; height: 844px; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 44px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.25); border: 10px solid #111; }
body.phone #desk { overflow-x: auto; scroll-snap-type: x mandatory; display: flex; gap: 0; bottom: 70px; }
body.phone .win { position: relative !important; left: auto !important; top: auto !important; width: 360px !important; height: calc(100% - 20px) !important; margin: 10px 7px 10px 15px; flex: none; scroll-snap-align: center; transform: none !important; }
body.phone .win.behind { display: none; }
body.phone #dock { transform: translate(-50%, 0); bottom: 8px; gap: 2px; padding: 6px; } body.phone #dock .ai { width: 34px; height: 34px; font-size: 15px; } body.phone #dock .ai:hover { width: 34px; height: 34px; }
body.phone #top { overflow-x: auto; } body.phone #opts { right: 8px; width: 300px; }
body.phone .stackdots { display: flex; }
.stackdots { display: none; gap: 4px; justify-content: center; padding: 4px; } .stackdots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); } .stackdots i.on { background: var(--accent); }
.hint { position: absolute; left: 16px; bottom: 16px; z-index: 5100; font-size: 12px; color: var(--muted); max-width: 520px; }
body.phone .hint, body.phone .hbtn { display: none; }
</style></head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div id="top"></div>
  <div id="desk"><svg id="threads"></svg></div>
  <div id="zones"></div>
  <div id="ghost"></div>
  <div id="home"></div>
  <div id="hist"></div>
  <button class="hbtn" id="histbtn">◷ History</button>
  <div class="hint">Drag a bubble by its title. Drop near another to sit beside it, on it to stack, at the top edge for layouts. Click a word to follow it. Move to the bottom edge for the dock. Options top right.</div>
  <div id="dockzone"></div>
  <div id="dock"></div>
  <div id="opts"></div>
</div>
<script>
const DATA = /*DATA*/null;
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const clone = o => JSON.parse(JSON.stringify(o));
const GAP = 12;

// ---- options: every choice the person asked to see, switchable --------------------------------------------------------
const OPT = { arrange: 'magnetic', many: 'bubbles', rabbit: 'beside', hview: 'scrubber', hscope: 'desk', device: 'desktop' };
const OPTDEF = [
  ['arrange', 'Bubbles on a desk', [['magnetic', 'Magnetic'], ['tiled', 'Always tiled'], ['free', 'Free canvas']],
    { magnetic: 'Free to drag; near an edge or another bubble it pulls in beside it; dropped on one, it stacks.', tiled: 'Bubbles never overlap: every drop reflows the desk into neat columns; dropped on one, it stacks.', free: 'Bubbles float anywhere and may overlap; Snap only from the top edge; dropped on a title, it stacks.' }],
  ['many', 'Several of one app', [['bubbles', 'Each its own bubble'], ['inside', 'One app, many inside'], ['both', 'Both, by choice']],
    { bubbles: 'Every passage, word or page is its own bubble; same-app bubbles share a tint.', inside: 'A second passage opens as a column inside the Bible bubble already open (the same for words and pages).', both: 'Each opens as a bubble; ⇲ Gather pulls the app\'s bubbles into one as columns, ⇱ pops a column out.' }],
  ['rabbit', 'Following a word', [['beside', 'New bubble, linked'], ['replace', 'Replace in place'], ['ask', 'Ask each time']],
    { beside: 'It opens beside the passage with a thread to show what led where. Alt+click replaces instead.', replace: 'The same bubble becomes the word; ← goes back.', ask: 'A small choice: here, beside, or on a new desk.' }],
  ['hview', 'History looks like', [['scrubber', 'Timeline scrubber'], ['map', 'Branching map']],
    { scrubber: 'Drag back and the desk replays itself; let go to stay. Doing something then starts a branch; nothing is lost.', map: 'Every step as a node; branches where you went back and took another way. Click a node to go there.' }],
  ['hscope', 'History of', [['window', 'This bubble'], ['desk', 'This desk'], ['app', 'The whole app']], {}],
  ['device', 'Seen on', [['desktop', 'Desktop'], ['phone', 'Phone']], { phone: 'Bubbles become full cards you swipe between; a stack is one card with dots.' }],
];

// ---- the model: desks of windows; history is a tree of small steps ------------------------------------------------------
let seq = 1;
const pages = {
  p1: { title: 'Salt lessons 2025', text: 'Start from <span class="ref" data-ref="Numbers 25">Numbers 25</span>, then <span class="ref" data-ref="John 1">John 1</span>. Questions to bring: what is zeal for?' },
  p2: { title: 'Word study: Word', text: 'Collect every use of the word for Word in <span class="ref" data-ref="John 1">John 1</span>.' },
  p3: { title: 'Sunday class: the covenant', text: 'Outline for the class. Read <span class="ref" data-ref="Genesis 1">Genesis 1</span> aloud first.' },
  p4: { title: 'Prayer list', text: 'Names and dates.' },
};
const folders = { f1: { title: 'Covenant', items: [['page', 'p3'], ['page', 'p1'], ['bible', 'Genesis 1'], ['bible', 'Romans 5']] } };
const win = (app, ref, x, y, w, ht, extra = {}) => ({ id: 'w' + seq++, app, ref, x, y, w, h: ht, z: seq, cols: [], stack: null, parent: null, back: [], fwd: [], ...extra });
let S = {
  desk: 'd1',
  desks: {
    d1: { name: 'Sunday lesson', wins: [win('bible', 'John 1', 24, 20, 560, 640), win('page', 'p1', 600, 20, 420, 380), win('folder', 'f1', 600, 412, 420, 248)] },
    d2: { name: 'Word study: zeal', wins: [win('bible', 'Numbers 25', 24, 20, 620, 640), win('word', 'H7065', 660, 20, 440, 520)] },
    d3: { name: 'Daily reading', wins: [win('bible', 'Psalms 23', 200, 20, 640, 600)] },
  },
  pages,
};
const H = { nodes: [], cur: null, viewing: null }; // the history tree: {id, parent, label, desk, win, snap}
function record(label, winId) {
  const node = { id: H.nodes.length, parent: H.cur, label, desk: S.desk, win: winId || null, t: Date.now(), snap: clone(S) };
  H.nodes.push(node); H.cur = node.id; H.viewing = null;
}
const D = () => S.desks[S.desk];
const W = id => D().wins.find(w => w.id === id);
const titleOf = w => w.app === 'bible' ? w.ref : w.app === 'word' ? `${w.ref} ${DATA.lex[w.ref]?.lemma || ''}` : w.app === 'page' ? S.pages[w.ref].title : w.app === 'folder' ? folders[w.ref].title : w.app === 'legend' ? 'Legend' : w.app === 'plans' ? 'Reading plans' : w.ref;
const APPNAME = { bible: 'Bible', word: 'Words', page: 'Notebook', folder: 'Folder', legend: 'Legend', plans: 'Reading plans' };

// ---- drawing -----------------------------------------------------------------------------------------------------------
function drawTop() {
  const t = $('#top'); t.replaceChildren();
  for (const [id, d] of Object.entries(S.desks)) {
    const b = h('button', 'desk' + (id === S.desk ? ' on' : ''), d.name); b.dataset.desk = id;
    b.onclick = () => { S.desk = id; record(`Switched to ${d.name}`); draw(); };
    t.append(b);
  }
  const nb = h('button', 'desk', '+ New desk'); nb.onclick = () => { const id = 'd' + seq++; S.desks[id] = { name: 'Desk ' + Object.keys(S.desks).length, wins: [] }; S.desk = id; record('New desk'); draw(); };
  const ob = h('button', '', 'Options'); ob.id = 'opts-btn'; ob.onclick = () => $('#opts').classList.toggle('open');
  t.append(nb, ob);
}
function drawOpts() {
  const o = $('#opts'); o.replaceChildren(h('b', '', 'Try each design'));
  for (const [key, label, choices, notes] of OPTDEF) {
    o.append(h('h4', '', label)); const seg = h('div', 'seg');
    for (const [v, l] of choices) { const b = h('button', OPT[key] === v ? 'on' : '', l); b.onclick = () => { OPT[key] = v; if (key === 'device') document.body.classList.toggle('phone', v === 'phone'); if (key === 'arrange' && v === 'tiled') tile(); drawOpts(); draw(); }; seg.append(b); }
    o.append(seg); if (notes[OPT[key]]) o.append(h('p', '', notes[OPT[key]]));
  }
}
function scripture(ref, lit) {
  const box = h('div', 'scr'); const vs = DATA.chapters[ref];
  if (!vs) { box.textContent = 'Not in the demo.'; return box; }
  for (const v of vs) {
    const span = h('span', lit && v.v === lit ? 'lit' : ''); span.dataset.v = v.v; span.append(h('span', 'vn', String(v.v)));
    for (const [t, s] of v.w) { const w = h('span', 'w', t); if (s) w.dataset.s = s; span.append(w); }
    box.append(span);
  }
  return box;
}
function body(w, ref = w.ref) {
  if (w.app === 'bible') return scripture(ref, w.lit);
  if (w.app === 'word') {
    const e = DATA.lex[ref] || {}; const box = h('div', 'lex');
    box.append(h('div', 'lem', e.lemma || ref), h('div', 'tr', `${e.translit || ''} · ${ref}`), h('p', '', e.def || ''), h('p', 'tr', 'KJV: ' + (e.usage || '')), h('h4', '', 'In the demo\'s chapters'));
    for (const [cref, vs] of Object.entries(DATA.chapters)) for (const v of vs) if (v.w.some(x => x[1] === ref)) {
      const u = h('span', 'use', `${cref}:${v.v}  ` + v.w.map(x => x[0]).join('').slice(0, 80) + '…'); u.dataset.go = `${cref}|${v.v}`; box.append(u);
    }
    return box;
  }
  if (w.app === 'page') {
    const p = S.pages[ref]; const box = h('div', 'pg'); box.append(h('h2', '', p.title));
    const ed = h('div'); ed.contentEditable = 'true'; ed.innerHTML = p.text;
    ed.oninput = () => { p.text = ed.innerHTML; clearTimeout(ed._t); ed._t = setTimeout(() => record(`Wrote in ${p.title}`, w.id), 700); };
    box.append(ed); return box;
  }
  if (w.app === 'folder') {
    const f = folders[ref]; const box = h('div', 'fl');
    for (const [k, r] of f.items) { const it = h('div', 'it'); it.append(h('span', '', k === 'page' ? '▤' : '▥'), h('span', '', k === 'page' ? S.pages[r].title : r)); it.dataset.open = `${k === 'page' ? 'page' : 'bible'}|${r}`; box.append(it); }
    return box;
  }
  if (w.app === 'legend') { const box = h('div'); for (const [c, n] of [['#F6D96B', 'Promise'], ['#9FD3A8', 'Command'], ['#9CC3F0', 'Christ'], ['#F3A6A6', 'Warning']]) { const r = h('div', 'it'); r.innerHTML = `<i style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${c};margin-right:8px"></i>${n}`; box.append(r); } return box; }
  return h('div', '', 'Today: Psalms 23 (open it from Home).');
}
function draw() {
  drawTop();
  const desk = $('#desk'); for (const el of [...desk.querySelectorAll('.win')]) el.remove();
  const wins = D().wins;
  // stacks: the front of each stack is the highest z; the ones behind fan out up and right
  const stacks = {}; for (const w of wins) if (w.stack) (stacks[w.stack] ||= []).push(w);
  for (const s of Object.values(stacks)) s.sort((a, b) => a.z - b.z);
  const front = wins.reduce((a, b) => (b.z > (a?.z ?? -1) ? b : a), null);
  for (const w of wins) {
    const el = h('div', `win t-${w.app}` + (w === front ? ' front' : '')); el.dataset.id = w.id;
    let x = w.x, y = w.y; const st = w.stack ? stacks[w.stack] : null;
    if (st) { const i = st.indexOf(w), n = st.length; const off = (n - 1 - i) * 10; x += off; y -= off; if (i < n - 1) { el.classList.add('behind'); el.style.opacity = String(1 - (n - 1 - i) * .18); } }
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w.w + 'px', height: w.h + 'px', zIndex: w.z });
    const wt = h('div', 'wt');

  for (const n of H.nodes) { if (n.parent == null) { lane[n.id] = 0; continue; } const pl = lane[n.parent]; if (!used[n.parent]) { lane[n.id] = pl; used[n.parent] = true; } else lane[n.id] = ++lanes; }
  const xs = {}; show.forEach((n, i) => xs[n.id] = 20 + i * Math.max(14, Math.min(60, (box.clientWidth - 60) / Math.max(1, show.length))));
  for (const n of show) { const p = n.parent != null && xs[n.parent] != null ? n.parent : null; if (p != null) { const l = document.createElementNS(ns, 'path'); l.setAttribute('d', `M${xs[p]},${20 + lane[p] * 28} C${xs[p] + 20},${20 + lane[p] * 28} ${xs[n.id] - 20},${20 + lane[n.id] * 28} ${xs[n.id]},${20 + lane[n.id] * 28}`); l.setAttribute('stroke', '#9aa89a'); l.setAttribute('fill', 'none'); svg.append(l); } }
  for (const n of show) { const c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', xs[n.id]); c.setAttribute('cy', 20 + lane[n.id] * 28); c.setAttribute('r', n.id === H.cur ? 7 : 5); c.setAttribute('fill', n.id === H.cur ? 'var(--accent)' : '#fff'); c.setAttribute('stroke', 'var(--accent)');
    const t = document.createElementNS(ns, 'title'); t.textContent = n.label; c.append(t); c.onclick = () => { restore(n, false); openHist(); }; svg.append(c); }
  svg.setAttribute('height', String(40 + lanes * 28)); box.append(svg, h('p', 'lbl', 'Each dot is a step (hover for what it was). A new lane is a branch: you went back and took another way. Click a dot to go there.'));
}

// hooks for frames2.mjs, which puts the demo into each interaction row's state
window.__demo = { OPT, get S() { return S; }, H, D, W, openApp, follow, replaceIn, record, draw, drawOpts, tile, openHist, toggleHome, restore, gather, unstack, step };

drawZones(); drawOpts(); record('Opened the Workbench'); draw();
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === ' ') { e.preventDefault(); $('#dock').classList.toggle('up'); }
  if (e.ctrlKey && e.key === 'z' && !e.target.isContentEditable) { e.preventDefault(); const n = H.nodes[H.cur]; if (n?.parent != null) restore(H.nodes[n.parent], false); }
});
