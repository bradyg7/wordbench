<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* design/features/identity, the working demo, round 3. It keeps the ten rules in the README (R1-R10).
   Scripture and lexicon come from data.json (wb chapter, wb strong); page words are the demo's own invented study notes. */
:root { --paper:#FBFCFA; --paper2:#F4F6F1; --ink:#20261F; --muted:#6A7368; --line:#E2E7DE; --accent:#5E7D63; --accent-soft:#E3ECE2;
  --ui: Inter, system-ui, sans-serif; --serif: 'Source Serif 4', Georgia, serif; --r: 18px;
  --lift: 0 1px 2px rgba(25,35,25,.06), 0 8px 24px rgba(25,35,25,.08); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 14px/1.5 var(--ui); background: #dfe6da; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
#stage { position: fixed; inset: 0; overflow: hidden; }
/* the wallpaper: soft color for the glass to bend */
.wall { position: absolute; inset: -10%; background:
  radial-gradient(40% 50% at 12% 18%, #cfe0c9 0, transparent 70%), radial-gradient(45% 55% at 88% 82%, #d9dcc6 0, transparent 70%),
  radial-gradient(35% 40% at 72% 12%, #c8ddd3 0, transparent 70%), radial-gradient(30% 35% at 30% 90%, #e6dccb 0, transparent 70%), #e4eadf;
  animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(3%, -2%) scale(1.04); } }

/* ---- liquid glass (R7): light bends through it, a highlight follows the pointer ---------------------------------------- */
.glass { position: relative; isolation: isolate; background: rgba(255,255,255,.16);
  -webkit-backdrop-filter: blur(14px) saturate(1.8); backdrop-filter: blur(14px) saturate(1.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35), inset 1px 0 0 rgba(255,255,255,.45), inset -1px 0 0 rgba(255,255,255,.25), 0 10px 30px rgba(20,30,20,.14), 0 1px 3px rgba(20,30,20,.08); }
html.lens .glass { backdrop-filter: url(#lens) blur(2.5px) saturate(1.9) brightness(1.04); }
.glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.08) 45%, rgba(255,255,255,.18)); }
.glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(140px 90px at var(--mx, 30%) var(--my, 0%), rgba(255,255,255,.65), transparent 70%); mix-blend-mode: soft-light; opacity: .9; }

/* ---- the desks line ----------------------------------------------------------------------------------------------------- */
#top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; z-index: 50; }
.dk { padding: 5px 14px; border-radius: 999px; font-size: 13px; color: #3d463c; white-space: nowrap; position: relative; transition: color .2s; }
.dk.on { color: #fff; }
#dkpill { position: absolute; top: 4px; height: calc(100% - 8px); border-radius: 999px; background: var(--accent); box-shadow: 0 2px 8px rgba(60,90,60,.35); z-index: -1; }
.dk.drop { color: var(--accent); } .dk.drop::after { content: ''; position: absolute; inset: 0; border-radius: 999px; outline: 2px solid var(--accent); }
#optsbtn { position: absolute; top: 10px; right: 12px; z-index: 50; padding: 7px 14px; border-radius: 999px; font-size: 13px; }
#opts { position: absolute; top: 52px; right: 12px; width: 340px; border-radius: 20px; padding: 14px 16px; z-index: 60; display: none; }
#opts.open { display: block; }
#opts h4 { margin: 12px 0 5px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #4f584e; font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.35); }
.seg button { padding: 4px 11px; border-radius: 9px; font-size: 12.5px; } .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
#opts p { margin: 5px 0 0; color: #4f584e; font-size: 12px; }

/* ---- the desk and its bubbles (R1, R8) -------------------------------------------------------------------------------- */
#desk { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; }
.bub { position: absolute; border-radius: var(--r); background: var(--paper); box-shadow: var(--lift); overflow: hidden; contain: layout paint; will-change: left, top, width, height; }
.bub.focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent), var(--lift); }
.bub.lifted { box-shadow: 0 30px 70px rgba(20,30,20,.28), 0 6px 18px rgba(20,30,20,.14); z-index: 40 !important; cursor: grabbing; }
.bub.leaving { opacity: .35; filter: saturate(.4); }
.bub { transition: filter .3s, opacity .3s, transform .3s; }
.bub.under { filter: blur(3px) saturate(.7); opacity: .55; transform: scale(.985); pointer-events: none; }
.bub.full { z-index: 30; box-shadow: 0 30px 80px rgba(20,30,20,.25), 0 0 0 1px rgba(255,255,255,.7); }
.bub .bar { position: absolute; left: 6px; right: 6px; top: 6px; height: 36px; border-radius: 13px; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 4px; z-index: 3; cursor: grab; user-select: none; }
.bub .bar .ttl { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.bub .bar .app { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 2px 0 6px; white-space: nowrap; }
.bub .bar .tint { width: 8px; height: 8px; border-radius: 4px; background: var(--tint); flex: none; margin-left: 6px; }
.ib { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #4f584e; flex: none; transition: background .15s, transform .15s; }
.ib:hover { background: rgba(255,255,255,.6); color: var(--ink); } .ib:active { transform: scale(.9); } .ib:disabled { opacity: .3; pointer-events: none; }
.from { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap; max-width: 34%; overflow: hidden; text-overflow: ellipsis; flex: none; }
.bub .body { position: absolute; inset: 0; overflow: auto; padding: 52px 22px 22px; scrollbar-width: thin; }
.bub.t-bible { --tint: #5E7D63; } .bub.t-word { --tint: #6A5AA3; } .bub.t-page { --tint: #C0633A; } .bub.t-folder { --tint: #2A7D99; } .bub.t-legend { --tint: #A9740F; } .bub.t-plans { --tint: #3B5B7A; }
.scr { font-family: var(--serif); font-size: 17px; line-height: 1.7; max-width: 66ch; }
.scr .vn { font: 600 10px var(--ui); color: var(--muted); vertical-align: super; margin: 0 3px 0 2px; }
.scr .w[data-s] { cursor: pointer; border-radius: 4px; transition: background .12s, color .12s; } .scr .w[data-s]:hover { background: var(--accent-soft); color: var(--accent); }
.scr .lit { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 4px; animation: glow 2.4s ease-out 1; }
@keyframes glow { from { background: color-mix(in srgb, var(--accent) 38%, transparent); } }
.lex .lem { font: 600 30px var(--serif); } .lex .tr { color: var(--muted); } .lex p { margin: 8px 0; max-width: 60ch; }
.lex h4 { margin: 18px 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.use { display: block; padding: 7px 8px; margin: 0 -8px; border-radius: 9px; cursor: pointer; font-family: var(--serif); } .use:hover { background: var(--accent-soft); }
.pg h2 { margin: 2px 0 10px; font-size: 24px; letter-spacing: -.01em; } .pg [contenteditable] { outline: 0; min-height: 80px; font-size: 15px; line-height: 1.65; }
.ref { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.it { display: flex; gap: 10px; padding: 8px 10px; margin: 0 -10px; border-radius: 10px; cursor: pointer; } .it:hover { background: var(--accent-soft); }
.cols { display: flex; gap: 18px; } .cols > div { flex: 1; min-width: 0; } .cols h5 { margin: 0 0 6px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.cols h5 button { color: var(--accent); font-size: 11.5px; }
/* gutters between bubbles: drag to resize both (R6) */
.gut { position: absolute; z-index: 20; display: grid; place-items: center; }
.gut.v { width: 14px; cursor: col-resize; } .gut.h { height: 14px; cursor: row-resize; }
.gut i { display: block; border-radius: 3px; background: rgba(60,80,60,.0); transition: background .15s, transform .15s; }
.gut.v i { width: 4px; height: 38px; } .gut.h i { height: 4px; width: 38px; }
.gut:hover i, .gut.on i { background: rgba(60,80,60,.35); transform: scale(1.15); }
/* the landing outline (R4) */
#slot { position: absolute; border-radius: var(--r); border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); pointer-events: none; z-index: 35; opacity: 0; transition: opacity .15s; }
#slot.on { opacity: 1; }
#slot span { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 12px; color: var(--accent); background: rgba(255,255,255,.85); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
/* layouts at the window's top edge */
#layouts { position: absolute; top: 56px; left: 50%; display: flex; gap: 10px; padding: 10px; border-radius: 20px; z-index: 70; transform: translate(-50%, -14px) scale(.96); opacity: 0; pointer-events: none; transition: transform .25s cubic-bezier(.2,.9,.25,1.1), opacity .18s; }
#layouts.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.lay { width: 96px; height: 60px; display: grid; gap: 3px; padding: 4px; border-radius: 11px; background: rgba(255,255,255,.45); }
.lay i { border-radius: 6px; background: rgba(255,255,255,.75); } .lay.hot i { background: var(--accent); opacity: .85; }

/* ---- the dock, with the tray at its end (R3) --------------------------------------------------------------------------- */
#dockzone { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; z-index: 80; }
#dock { position: absolute; left: 50%; bottom: 10px; display: flex; align-items: flex-end; gap: 6px; padding: 7px 9px; border-radius: 26px; z-index: 90; transform: translate(-50%, 120px); }
.ai { width: 46px; height: 46px; border-radius: 13px; position: relative; flex: none; display: grid; place-items: center; font-size: 19px; color: var(--accent);
  background: linear-gradient(180deg, #fff, #f1f4ee); box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(20,30,20,.12); transform-origin: 50% 100%; }
.ai .nm { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); font-size: 12px; padding: 3px 10px; border-radius: 8px; color: var(--ink); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; }
.ai:hover .nm { opacity: 1; }
.ai .run { position: absolute; bottom: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: #4f584e; }
.dsep { width: 1px; align-self: stretch; margin: 6px 3px; background: rgba(60,80,60,.22); flex: none; }
.pill { height: 46px; max-width: 150px; padding: 0 12px 0 10px; border-radius: 13px; display: flex; align-items: center; gap: 7px; font-size: 12px; background: rgba(255,255,255,.7); box-shadow: 0 2px 6px rgba(20,30,20,.1); flex: none; transform-origin: 50% 100%; }
.pill b { width: 7px; height: 7px; border-radius: 4px; background: var(--tint); flex: none; } .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.t-bible { --tint: #5E7D63; } .pill.t-word { --tint: #6A5AA3; } .pill.t-page { --tint: #C0633A; } .pill.t-folder { --tint: #2A7D99; } .pill.t-legend { --tint: #A9740F; } .pill.t-plans { --tint: #3B5B7A; }

/* ---- history and home -------------------------------------------------------------------------------------------------- */
#hist { position: absolute; left: 50%; bottom: 84px; width: min(920px, calc(100% - 32px)); transform: translateX(-50%); border-radius: 22px; padding: 12px 16px 14px; z-index: 85; display: none; }
#hist.open { display: block; animation: rise .28s cubic-bezier(.2,.9,.25,1.1); }
@keyframes rise { from { transform: translate(-50%, 16px) scale(.98); opacity: 0; } }
#hist .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#hist input[type=range] { flex: 1; accent-color: var(--accent); }
#hist .lbl { font-size: 12.5px; color: #3d463c; }
#hist svg { width: 100%; } #hist svg circle { cursor: pointer; transition: r .15s; } #hist svg circle:hover { r: 8; }
.past .bub { filter: sepia(.18) saturate(.85); }
#histbtn { position: absolute; right: 12px; bottom: 12px; z-index: 75; padding: 9px 15px; border-radius: 999px; font-size: 13px; }
#home { position: absolute; inset: 52px 0 0; z-index: 30; display: none; padding: 30px 6% 110px; overflow: auto; }
#home.open { display: block; animation: rise2 .3s cubic-bezier(.2,.9,.25,1.1); } @keyframes rise2 { from { opacity: 0; transform: translateY(12px); } }
#home .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; max-width: 1080px; margin: 0 auto; }
.tile { background: var(--paper); border-radius: 22px; box-shadow: var(--lift); padding: 20px 22px; }
.tile h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.go { margin-top: 12px; background: var(--accent); color: #fff; border-radius: 11px; padding: 8px 16px; box-shadow: 0 2px 8px rgba(60,90,60,.3); }
.pop { position: absolute; z-index: 100; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; min-width: 200px; animation: popin .2s cubic-bezier(.2,.9,.25,1.2); }
@keyframes popin { from { transform: scale(.92); opacity: 0; } }
.pop button { text-align: left; padding: 7px 12px; border-radius: 10px; } .pop button:hover { background: rgba(255,255,255,.65); }
.toast { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; z-index: 95; font-size: 13px; animation: popin .25s; }
/* phone */
body.phone { background: #cbd3c6; }
body.phone #stage { inset: auto; left: 50%; top: 50%; width: 390px; height: 844px; transform: translate(-50%, -50%); border-radius: 46px; box-shadow: 0 30px 80px rgba(0,0,0,.25), 0 0 0 10px #111; }
body.phone #top { top: 12px; max-width: 360px; overflow-x: auto; } body.phone #optsbtn { top: auto; bottom: 92px; }
body.phone #desk { top: 54px; bottom: 82px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; padding: 0 15px; }
body.phone .bub { position: relative !important; left: auto !important; top: auto !important; width: 360px !important; height: 100% !important; flex: none; scroll-snap-align: center; }
body.phone .gut, body.phone #histbtn { display: none; }
body.phone #dock { transform: translate(-50%, 0) !important; bottom: 12px; gap: 3px; padding: 6px; } body.phone .ai { width: 36px; height: 36px; font-size: 15px; } body.phone .pill { height: 36px; max-width: 70px; }
.hint { transition: opacity .6s; } .hint.gone { opacity: 0; pointer-events: none; }
.hint { position: absolute; left: 14px; bottom: 14px; z-index: 74; font-size: 12px; color: #4f584e; max-width: 430px; padding: 8px 12px; border-radius: 14px; }
body.phone .hint { display: none; }
</style></head>

// ---- one spring for everything (R5) ----------------------------------------------------------------------------------
const K = 420, C = 34; let SLOW = 1;
const springs = new Map(); // id -> {el, cur:{x,y,w,h}, v:{...}, to:{...}, free}
let running = false;
function animate() {
  if (running) return; running = true; let last = performance.now();
  const tick = now => {
    const dt = Math.min(1 / 30, (now - last) / 1000) * SLOW; last = now; let moving = false;
    for (const s of springs.values()) {
      if (s.free) continue;
      for (const k of ['x', 'y', 'w', 'h']) {
        const d = s.to[k] - s.cur[k], a = K * d - C * s.v[k]; s.v[k] += a * dt; s.cur[k] += s.v[k] * dt;
        if (Math.abs(d) < .3 && Math.abs(s.v[k]) < .3) { s.cur[k] = s.to[k]; s.v[k] = 0; } else moving = true;
      }
      paint(s);
    }
    tickDock(dt); if (moving || dockMoving) requestAnimationFrame(tick); else running = false;
  };
  requestAnimationFrame(tick);
}
const paint = s => { const st = s.el.style; st.left = s.cur.x + 'px'; st.top = s.cur.y + 'px'; st.width = Math.max(40, s.cur.w) + 'px'; st.height = Math.max(40, s.cur.h) + 'px'; };

// ---- keys (R10) ---------------------------------------------------------------------------------------------------------------
window.addEventListener('keydown', e => {
  const typing = e.target.isContentEditable || /INPUT|TEXTAREA/.test(e.target.tagName);
  if (e.key === 'Escape' && fullId) { e.preventDefault(); toggleFull(fullId); return; }
  if (e.ctrlKey && e.key === 'Enter' && focus && !typing) { e.preventDefault(); toggleFull(focus); return; }
  if (e.ctrlKey && e.key === ' ') { e.preventDefault(); dockUpTo = dockUpTo ? 0 : 1; dockMoving = true; animate(); }
  if (typing) return;
