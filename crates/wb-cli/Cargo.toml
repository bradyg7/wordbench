[package]
name = "wb-cli"
description = "The wb command: every core action of Bible Workbench from a terminal"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
distribution = ["wb-core/distribution"]

[lib]
name = "wb_cli"
path = "src/lib.rs"

[[bin]]
name = "wb"
path = "src/main.rs"

[dependencies]
wb-core.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
regex.workspace = true
rusqlite.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
