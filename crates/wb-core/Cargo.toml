[package]
name = "wb-core"
description = "Everything in Bible Workbench that is not drawing"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
distribution = ["dep:wb-license"]
# A release installed by the person or a tester (the updater build): the study folder the person chooses is opened,
# whatever it is. Development builds and tests never have it, so they keep refusing the real study folder.
installed = []
# The look at the update feed from a terminal (wb update check) and from the window: one small HTTPS GET.
updater = ["dep:ureq", "dep:minisign-verify", "dep:base64"]

[dependencies]
wb-license = { path = "../wb-license", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-normalization.workspace = true
chrono.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-svg = "0.15"
flate2 = "1.1.11"
lopdf = { version = "0.47.0", default-features = false }
tempfile = "3.27.0"
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
# The update's signature, checked against the key compiled into the program (design/features/updates U-12, U-17).
minisign-verify = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
rusqlite.workspace = true

[lib]
doctest = false
