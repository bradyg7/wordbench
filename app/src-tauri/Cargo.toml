[package]
name = "bible-workbench"
description = "Bible Workbench: the Tauri 2 shell over wb-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
distribution = ["wb-core/distribution", "wb-cli/distribution"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wb-core.workspace = true
wb-cli = { path = "../../crates/wb-cli" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
