[package]
name = "bible-workbench"
description = "Bible Workbench: the Tauri 2 shell over wb-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
distribution = ["wb-core/distribution", "wb-cli/distribution"]
# Automatic updates. Off by default. The update check needs the release's public key and endpoint in the build's
# plugins.updater configuration; without them the app starts and simply has no update check (distribution/README.md).
updater = ["dep:tauri-plugin-dialog", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wb-core.workspace = true
wb-cli = { path = "../../crates/wb-cli" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
