# The website (design/features/site, S-1, S-5, row 8). Builds site/ with the newest release's details and pushes the
# result to the gh-pages branch of the public bradyg7/wordbench-releases, whose GitHub Pages serves it at
# https://bradyg7.github.io/wordbench-releases/. Runs when the site or the release notes change on main, when
# release.yml has published, and by hand (gh workflow run site.yml).
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/releases/**', 'distribution/release.mjs', 'scripts/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The newest release's details
        run: node scripts/site/fetch-release.mjs --out site/public/release.json && cat site/public/release.json

      - name: Build
        env:
          SITE_BASE: /wordbench-releases/
        run: npx tsc -p site && npx vite build --config site/vite.config.ts

      - name: Push to wordbench-releases gh-pages
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd site/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "wordbench-site"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/bradyg7/wordbench-releases.git" gh-pages
